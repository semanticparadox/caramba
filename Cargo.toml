[workspace]
resolver = "2"
members = [
    "apps/caramba-bot",
    "apps/caramba-installer",
    "apps/caramba-node",
    "apps/caramba-panel",
    "apps/caramba-sub",
    "libs/caramba-db",
    "libs/caramba-shared",
]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
