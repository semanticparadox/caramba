[package]
name = "caramba-shared"
version = "0.9.63"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], default-features = false, optional = true }
tracing = { version = "0.1", optional = true }
maxminddb = { version = "0.24", optional = true }
sha2 = { version = "0.10", optional = true }
uuid = { version = "1.11", features = ["v4"], optional = true }
anyhow = { version = "1.0", optional = true }
tokio = { version = "1", features = ["fs"], optional = true }
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
base64 = { version = "0.22", optional = true }

[features]
geo = ["dep:reqwest", "dep:tracing", "dep:maxminddb"]
self-update = ["dep:reqwest", "dep:tracing", "dep:sha2", "dep:uuid", "dep:anyhow", "dep:tokio"]
license = ["dep:ed25519-dalek", "dep:chrono", "dep:base64"]

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
