[package]
name = "caramba-node"
version = "0.9.67"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }
machine-uid = "0.5" # For persistent HWID
dotenvy = "0.15"
caramba-shared = { path = "../../libs/caramba-shared", features = ["self-update"] }
md5 = "0.8"
rand = "0.9"
sysinfo = "0.38" # Telemetry
sha2 = "0.10"
tokio-rustls = "0.26"
x509-parser = "0.16"
rustls = "0.23"
rustls-pki-types = "1.0"
webpki-roots = "0.26"
# Генерация самоподписанного сертификата для TLS-инбаундов (Hysteria2, VLESS+TLS)
rcgen = "0.13"

# gRPC-клиент к experimental.v2ray_api sing-box — единственный источник
# трафика по пользователям (Clash API имени пользователя не отдаёт вовсе).
# Код клиента сгенерирован заранее и лежит в src/v2rayapi.rs, поэтому
# protoc при сборке не нужен и tonic-build в зависимостях не значится.
tonic = "0.12"
prost = "0.13"
