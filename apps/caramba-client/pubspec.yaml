name: caramba_client
description: "Caramba — censorship-resistant VPN super-app."
publish_to: "none"
version: 1.0.0+100

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Native VPN tunnel: federated plugin bridging com.caramba/vpn channels to the
  # Go core (gomobile on mobile, libcaramba_core on desktop). Enabled at build
  # time via --dart-define=USE_NATIVE_VPN=true; falls back to mock otherwise.
  caramba_vpn:
    path: packages/caramba_vpn

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure storage (JWT access/refresh tokens)
  flutter_secure_storage: ^9.2.2

  # Charts (traffic / usage)
  fl_chart: ^0.69.2

  # Embedded minibrowser
  webview_flutter: ^4.10.0

  # External deep links (Telegram bot, web fallback)
  url_launcher: ^6.3.1

  # Inbound deep links / custom URL scheme (carambaconnect://enroll). Handles
  # both cold-start (app launched by the link) and warm (already running).
  app_links: ^6.3.2

  # Vector assets / line illustrations
  flutter_svg: ^2.0.16

  # Models / serialization (annotations)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Codegen for freezed / json_serializable
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
