// Gradle build for the caramba_vpn Android plugin module.
//
// This module hosts the Kotlin VPN plugin (CarambaVpnPlugin) and the Android
// VpnService (CarambaVpnService). It bridges the com.caramba/vpn channels to the
// Go core through the gomobile-generated AAR (caramba.aar), which exports the
// `mobile` package as the Java/Kotlin class `Mobile` (static factory
// Mobile.newClient(...)) and a `Client` type with camelCased methods (up, down,
// statusJSON, trafficJSON, setTunFd, configure).
//
// CODE IDENTIFIERS stay 'caramba' (the user-facing brand is 'exarobot').
//
// The gomobile AAR is vendored under android/libs/ and picked up as a file dependency
// repository below. Build it on the user's machine with:
//
//   cd libs/caramba-core
//   gomobile bind -target=android -androidapi 21 -tags mihomo \
//     -o apps/caramba-client/packages/caramba_vpn/android/libs/caramba.aar \
//     ./mobile
//
// (The `mihomo` build tag is REQUIRED so the real engine_mihomo.go is compiled
// in; without it the bundled stub does not move packets.)

group 'com.caramba.caramba_vpn'
version '1.0'

buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// The vendored gomobile AAR cannot be consumed as `implementation files(*.aar)`:
// AGP refuses a direct local .aar dependency in a library module (the
// :caramba_vpn:bundleDebugAar task fails with "Direct local .aar file
// dependencies are not supported when building an AAR"), because those classes
// and .so files would not be repackaged into this module's own AAR.
//
// caramba.aar is a plain gomobile binding: classes.jar + jni/<abi>/libgojni.so,
// an EMPTY R.txt and a manifest carrying only <uses-sdk>. So exploding it into a
// jar dependency + a jniLibs source dir is lossless, and both of those forms ARE
// packaged into the consuming app.
def carambaAarFile = file("${project.projectDir}/libs/caramba.aar")
def carambaAarDir = layout.buildDirectory.dir("caramba-aar")

def explodeCarambaAar = tasks.register('explodeCarambaAar', Copy) {
    from(zipTree(carambaAarFile))
    into(carambaAarDir)
    include 'classes.jar'
    include 'jni/**'
}

android {
    namespace 'com.caramba.caramba_vpn'
    // Must match the host app (flutter.compileSdkVersion == 36). The
    // flutter_embedding / androidx AARs pulled in by Flutter 3.47 declare an
    // AAR-metadata floor of compileSdk 36, so a lower value fails
    // checkDebugAarMetadata. Compile-time only: minSdk below is unchanged.
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        // gomobile -androidapi 21 → minSdk 21. VpnService needs 21+; the
        // FOREGROUND_SERVICE_SPECIAL_USE type used below needs 34 at runtime but
        // degrades gracefully on older devices (handled in CarambaVpnService).
        minSdk 21
    }

    // Allow the module to build even if libs/caramba.aar is not yet present in a
    // CI lint pass; the real build requires it (gomobile bind output).
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        // libgojni.so for every ABI shipped by the binding, taken from the
        // exploded AAR above (see explodeCarambaAar).
        main.jniLibs.srcDirs += carambaAarDir.map { it.dir('jni') }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // androidx.annotation for @NonNull on the plugin callbacks.
    implementation 'androidx.annotation:annotation:1.7.1'
    // Go core classes from the vendored gomobile binding (libs/caramba.aar),
    // exploded by explodeCarambaAar. Java package: io.caramba.core.mobile
    // (Mobile.newClient(...) -> Client), wrapped by CarambaCore.kt.
    implementation files(carambaAarDir.map { it.file('classes.jar') }) {
        builtBy explodeCarambaAar
    }
    // The Flutter Android Gradle plugin injects the io.flutter:flutter_embedding_*
    // dependency for plugin modules automatically, so FlutterPlugin / MethodChannel /
    // EventChannel resolve without being declared here (standard plugin template).
    // org.json (JSONObject) is part of the Android platform — no dependency needed.
}

// jniLibs source dirs are not part of the dependency graph, so make every build
// path wait for the AAR to be exploded.
tasks.named('preBuild').configure {
    dependsOn explodeCarambaAar
}
