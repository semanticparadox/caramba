<div class="modal-container max-w-3xl">
    <header class="modal-header">
        <h3 class="modal-title flex items-center gap-2">
            <i data-lucide="terminal" class="w-4 h-4 text-brand"></i>
            Manual Node Install
        </h3>
        <button type="button" onclick="document.getElementById('manual-install-modal').close()" class="btn-icon">
            <i data-lucide="x"></i>
        </button>
    </header>

    <div class="modal-body space-y-5">
        <div class="rounded-xl border border-brand/20 bg-brand/5 px-4 py-3">
            <p class="text-[11px] uppercase tracking-widest text-slate-400">Node</p>
            <p class="text-sm font-semibold text-white mt-1">{{ node_name }} <span class="text-slate-500 font-mono">#{{ node_id }}</span></p>
        </div>
        <p class="text-sm text-slate-300">
            Node is created in pending mode. Run the command on the target server, then return to the list and refresh status.
        </p>
        <pre id="manual-install-command"
            class="bg-black/40 border border-white/10 rounded-xl p-5 text-xs text-emerald-300 overflow-x-auto font-mono leading-relaxed"></pre>
    </div>

    <footer class="modal-footer">
        <button type="button" onclick="document.getElementById('manual-install-modal').close()" class="btn btn-secondary">Close</button>
        <button type="button" onclick="navigator.clipboard.writeText(document.getElementById('manual-install-command').textContent)"
            class="btn btn-primary">
            <i data-lucide="copy"></i>
            Copy Command
        </button>
    </footer>
</div>
<script>
    (function () {
        const origin = window.location.origin;
        const command = `curl -fsSL ${origin}/install.sh | sudo bash -s -- --role node --panel ${origin} --token {{ join_token }}`;
        document.getElementById('manual-install-command').textContent = command;
    })();
</script>
