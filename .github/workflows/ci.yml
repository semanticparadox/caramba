name: CI

# End-to-end CI for the Caramba monorepo:
#   - Rust workspace: panel / bot / node / sub / installer + libs
#   - Flutter client: apps/caramba-client
#
# Release build is its own workflow (release.yml); it only runs on `v*` tags.
#
# Native platform builds and Go-core packaging run in the client release workflows.
#
# Rust notes:
#   - `caramba-panel` uses sqlx at runtime (sqlx::query / sqlx::query_as), not
#     the compile-time `query!` / `query_as!` macros. `caramba-db` uses
#     sqlx::migrate!("./migrations") which only embeds .sql at build time and
#     does NOT need a live DB. So `cargo check` / `cargo test` build WITHOUT
#     Postgres. SQLX_OFFLINE is set just in case (no-op without `query!`
#     macros / .sqlx cache) and harmless.
#
# Flutter tests exercise the application with mocked platform boundaries.
# Native packaging is checked separately by the client workflows.

on:
  push:
  pull_request:

# Cancel in-flight runs on the same ref when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Rust workspace
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (fmt + check + clippy + test)
    runs-on: ubuntu-latest
    env:
      # Belt-and-suspenders: caramba-panel does not use compile-time sqlx
      # macros today, but if someone adds a `query!` macro without a live DB
      # the build will fail. Setting SQLX_OFFLINE keeps the build hermetic.
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cache cargo registry, index, git db, and target by Cargo.lock hash.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # System deps for panel/node (openssl, pkg-config), same as release.yml.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Flutter client
  # ---------------------------------------------------------------------------
  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/caramba-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  mini-app:
    name: Telegram Mini App (TypeScript + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/caramba-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/caramba-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  core:
    name: VPN core (Go tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/caramba-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: libs/caramba-core/go.mod
          cache-dependency-path: libs/caramba-core/go.sum
      - name: Test
        run: go test ./...
