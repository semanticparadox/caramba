name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Setup Go (для сборки sing-box)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/caramba-app/package-lock.json

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake musl-tools

      - name: Build Mini App Assets
        run: |
          cd apps/caramba-app
          npm ci
          npm run build

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep -m 1 '^version = ' apps/caramba-panel/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Verify Workspace
        run: cargo check --workspace

      - name: Build All Binaries (Release)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --workspace --exclude caramba-app

      # Своя сборка sing-box: официальный пакет SagerNet идёт БЕЗ
      # `with_v2ray_api`, а без него нет статистики по пользователям — Clash API
      # имени пользователя не отдаёт вовсе (проверено по исходнику,
      # experimental/clashapi/trafficontrol/tracker.go). Отсюда и неработающие
      # лимиты трафика, и «0 подключённых устройств».
      #
      # Набор тегов повторяет официальный (`sing-box version` → Tags) плюс
      # with_v2ray_api: узлы должны получить ровно тот же функционал, что и
      # раньше, а не урезанный.
      #
      # Версия закреплена: обновлять её — отдельное осознанное решение, а не
      # побочный эффект релиза панели.
      - name: Build sing-box with v2ray_api
        env:
          SING_BOX_VERSION: v1.13.14
          SING_BOX_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_naive_outbound,with_v2ray_api
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SING_BOX_VERSION" https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags "$SING_BOX_TAGS" \
            -trimpath -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=${SING_BOX_VERSION#v}" \
            -o /tmp/sing-box-bin ./cmd/sing-box
          # Отказ сборки без тега лучше молчаливой раздачи бинарника, который
          # не умеет того, ради чего он собирается.
          /tmp/sing-box-bin version | tee /tmp/sb-version.txt
          grep -q 'with_v2ray_api' /tmp/sb-version.txt

      - name: Prepare Artifacts
        run: |
          mkdir release
          cp target/x86_64-unknown-linux-musl/release/caramba-panel release/
          cp target/x86_64-unknown-linux-musl/release/caramba-node release/
          cp target/x86_64-unknown-linux-musl/release/caramba-bot release/
          cp target/x86_64-unknown-linux-musl/release/caramba-sub release/
          cp target/x86_64-unknown-linux-musl/release/caramba-installer release/
          cp /tmp/sing-box-bin release/sing-box
          tar -czf release/caramba-app-dist.tar.gz apps/caramba-app/dist
          # Integrity manifest — install.sh verifies the downloaded installer
          # against this before executing it as root (supply-chain hardening).
          (cd release && sha256sum caramba-panel caramba-node caramba-bot caramba-sub caramba-installer sing-box caramba-app-dist.tar.gz > SHA256SUMS)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            release/caramba-panel
            release/caramba-node
            release/caramba-bot
            release/caramba-sub
            release/caramba-installer
            release/sing-box
            release/caramba-app-dist.tar.gz
            release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
