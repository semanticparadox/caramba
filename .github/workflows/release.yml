name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/caramba-app/package-lock.json

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake musl-tools

      - name: Build Mini App Assets
        run: |
          cd apps/caramba-app
          npm ci
          npm run build

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep -m 1 '^version = ' apps/caramba-panel/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Verify Workspace
        run: cargo check --workspace

      - name: Build All Binaries (Release)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --workspace --exclude caramba-app

      - name: Prepare Artifacts
        run: |
          mkdir release
          cp target/x86_64-unknown-linux-musl/release/caramba-panel release/
          cp target/x86_64-unknown-linux-musl/release/caramba-node release/
          cp target/x86_64-unknown-linux-musl/release/caramba-bot release/
          cp target/x86_64-unknown-linux-musl/release/caramba-sub release/
          cp target/x86_64-unknown-linux-musl/release/caramba-installer release/
          tar -czf release/caramba-app-dist.tar.gz apps/caramba-app/dist
          # Integrity manifest — install.sh verifies the downloaded installer
          # against this before executing it as root (supply-chain hardening).
          (cd release && sha256sum caramba-panel caramba-node caramba-bot caramba-sub caramba-installer caramba-app-dist.tar.gz > SHA256SUMS)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            release/caramba-panel
            release/caramba-node
            release/caramba-bot
            release/caramba-sub
            release/caramba-installer
            release/caramba-app-dist.tar.gz
            release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
